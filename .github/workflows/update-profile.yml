name: Update profile

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_profile.py
      - scripts/generate_portrait.py
      - scripts/requirements.txt
      - assets/portrait/**
      - tests/**
      - .github/workflows/update-profile.yml
  pull_request:
    paths:
      - README.md
      - scripts/update_profile.py
      - scripts/generate_portrait.py
      - scripts/requirements.txt
      - assets/portrait/**
      - tests/**
      - .github/workflows/update-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Check profile generator
        run: python3 -m unittest discover -s tests -v

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Generate portrait if a photo is present
        run: python3 scripts/generate_portrait.py
      - name: Refresh public work
        run: python3 scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed content
        env:
          GIT_AUTHOR_NAME: Luseefor
          GIT_AUTHOR_EMAIL: sapanakosansar18@gmail.com
          GIT_COMMITTER_NAME: Luseefor
          GIT_COMMITTER_EMAIL: sapanakosansar18@gmail.com
        run: |
          git add README.md assets/portrait
          if git diff --cached --quiet; then
            exit 0
          fi
          for identity in "$(git var GIT_AUTHOR_IDENT)" "$(git var GIT_COMMITTER_IDENT)"; do
            case "$identity" in
              'Luseefor <sapanakosansar18@gmail.com>'*) ;;
              *) echo "Unexpected Git identity"; exit 1 ;;
            esac
          done
          git commit -m "chore: refresh profile content [skip ci]"
          git push origin HEAD:main

  contributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: Luseefor
      GIT_AUTHOR_EMAIL: sapanakosansar18@gmail.com
      GIT_COMMITTER_NAME: Luseefor
      GIT_COMMITTER_EMAIL: sapanakosansar18@gmail.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Luseefor
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#58a6ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353
      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for name in ("github-snake.svg", "github-snake-dark.svg"):
              path = Path("dist") / name
              root = ElementTree.parse(path).getroot()
              assert root.tag == "{http://www.w3.org/2000/svg}svg", name
              assert root.findall(".//{http://www.w3.org/2000/svg}animate") or "@keyframes" in path.read_text(), name
          PY
      - name: Verify Git identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          for identity in "$(git var GIT_AUTHOR_IDENT)" "$(git var GIT_COMMITTER_IDENT)"; do
            case "$identity" in
              'Luseefor <sapanakosansar18@gmail.com>'*) ;;
              *) echo "Unexpected Git identity"; exit 1 ;;
            esac
          done
      - name: Publish contribution SVGs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          user_name: Luseefor
          user_email: sapanakosansar18@gmail.com
          full_commit_message: "chore: refresh contribution snake [skip ci]"
