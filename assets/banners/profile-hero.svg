<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Luseefor profile hero banner</title>
  <desc id="desc">Minimal typographic hero banner for Luseefor — Software Engineer.</desc>

  <!-- Base -->
  <rect width="1200" height="280" fill="#0A1220"/>

  <!-- Top rule -->
  <rect x="80" y="56" width="1040" height="1" fill="#152238"/>

  <!-- Accent bar -->
  <rect x="80" y="76" width="3" height="128" rx="1.5" fill="#58A6FF"/>

  <!-- Wordmark -->
  <text x="110" y="142" fill="#F0F5FA" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-0.04em">Luseefor</text>

  <!-- Role -->
  <text x="112" y="178" fill="#7A9CC6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="500" letter-spacing="0.02em">Software Engineer</text>

  <!-- Bottom rule -->
  <rect x="80" y="223" width="1040" height="1" fill="#152238"/>
</svg>
