<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Luseefor profile hero banner</title>
  <desc id="desc">Terminal-styled hero banner for Luseefor — Software Engineer.</desc>

  <!-- Window background -->
  <rect width="1200" height="300" rx="0" fill="#0D1117"/>

  <!-- Title bar -->
  <rect width="1200" height="48" fill="#161B22"/>
  <rect y="48" width="1200" height="1" fill="#30363D"/>

  <!-- Window controls -->
  <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="76" cy="24" r="6" fill="#27C93F"/>

  <!-- Tab -->
  <text x="108" y="29" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="500">README.md</text>

  <!-- Content -->
  <text x="64" y="120" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="500" letter-spacing="0.02em">// Luseefor</text>
  <text x="64" y="162" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="400" letter-spacing="0.02em">// Software Engineer</text>
  <text x="64" y="204" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="400" letter-spacing="0.02em">// Professionally making computers do weird things.</text>

  <!-- Prompt line -->
  <text x="64" y="256" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600">$</text>
  <text x="84" y="256" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="500">open rijan.sh</text>
  <rect x="226" y="242" width="10" height="22" fill="#58A6FF">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
